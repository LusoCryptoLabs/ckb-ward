name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: the demo page builds
        working-directory: demo
        run: npm ci && npm run build
      - name: the playground page builds
        working-directory: playground
        run: npm ci && npm run build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vm/target
          key: ward-vm-${{ hashFiles('vm/Cargo.lock') }}
      - name: build ward-vm
        working-directory: vm
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked
      # Offline: the vector replays need the testnet RPC. The assembled locks run under ward-vm.
      - run: npm test
        env:
          CKB_WARD_OFFLINE: "1"
          WARD_VM: vm/target/release/ward-vm
